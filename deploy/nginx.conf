# VeeJay Wizard (deploy/README.md): the app only at https://<host>/__SLUG__/ (the Dockerfile writes the slug in).
# Every other path is 404, robots.txt disallows all. No login: the slug is the lock.
server {
  listen 80;
  server_tokens off;
  return 301 https://$host$request_uri; # AudioWorklet and getUserMedia need a secure context
}

server {
  listen 443 ssl;
  http2 on;
  server_tokens off;
  absolute_redirect off; # /slug -> /slug/ on whatever host port maps here
  ssl_certificate /etc/nginx/certs/fullchain.pem; # mounted, or the self-signed one 40-selfsigned.sh makes
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  root /usr/share/nginx/html;
  add_header X-Robots-Tag "noindex, nofollow" always;
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }
  location / {
    return 404;
  }
  location = /__SLUG__ {
    return 301 /__SLUG__/;
  }
  location /__SLUG__/ {
    expires -1; # Cache-Control: no-cache: index.html and the unhashed public/ files revalidate
    try_files $uri $uri/ =404;
  }
  location /__SLUG__/assets/ {
    expires 1y; # hashed file names
    try_files $uri =404;
  }
}
